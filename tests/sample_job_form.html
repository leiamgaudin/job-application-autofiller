<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sample Job Application Portal</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input[type="text"], input[type="email"], input[type="tel"], select { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .radio-group label { display: inline-block; font-weight: normal; margin-right: 15px; }
  </style>
</head>
<body>
  <h1>Careers: Senior Software Engineer</h1>
  <form id="job-app-form">
    <div class="form-group">
      <label for="resume">Attach Resume / CV *</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
    </div>

    <div class="form-group">
      <label for="first_name">First Name *</label>
      <input type="text" id="first_name" name="first_name">
    </div>

    <div class="form-group">
      <label for="last_name">Last Name *</label>
      <input type="text" id="last_name" name="last_name">
    </div>

    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number *</label>
      <input type="tel" id="phone" name="phone">
    </div>

    <div class="form-group">
      <label for="linkedin">LinkedIn Profile URL</label>
      <input type="text" id="linkedin" name="urls[linkedin]">
    </div>

    <div class="form-group">
      <label for="github">GitHub Profile URL</label>
      <input type="text" id="github" name="urls[github]">
    </div>

    <div class="form-group">
      <label for="work_auth">Are you legally authorized to work in the United States?</label>
      <select id="work_auth" name="authorized_to_work">
        <option value="">-- Please Select --</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </div>

    <div class="form-group">
      <label for="sponsorship">Will you now or in the future require visa sponsorship?</label>
      <select id="sponsorship" name="require_sponsorship">
        <option value="">-- Please Select --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <h3>Demographics & Equal Employment Opportunity (EEO)</h3>

    <div class="form-group">
      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">Select Gender</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="nonbinary">Non-Binary</option>
        <option value="decline">I decline to identify</option>
      </select>
    </div>

    <div class="form-group">
      <label for="race">Race / Ethnicity</label>
      <select id="race" name="race_ethnicity">
        <option value="">Select Race / Ethnicity</option>
        <option value="white">White (Not Hispanic or Latino)</option>
        <option value="black">Black or African American</option>
        <option value="hispanic">Hispanic or Latino</option>
        <option value="asian">Asian</option>
        <option value="decline">Decline to self-identify</option>
      </select>
    </div>

    <div class="form-group">
      <label>Veteran Status</label>
      <div class="radio-group">
        <label><input type="radio" name="veteran" value="not_veteran"> I am not a protected veteran</label><br>
        <label><input type="radio" name="veteran" value="is_veteran"> I identify as a protected veteran</label><br>
        <label><input type="radio" name="veteran" value="decline"> I do not wish to answer</label>
      </div>
    </div>

    <div class="form-group">
      <label>Disability Status</label>
      <div class="radio-group">
        <label><input type="radio" name="disability" value="no"> No, I do not have a disability</label><br>
        <label><input type="radio" name="disability" value="yes"> Yes, I have a disability</label><br>
        <label><input type="radio" name="disability" value="decline"> I do not wish to answer</label>
      </div>
    </div>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
